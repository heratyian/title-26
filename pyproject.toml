[project]
name = "title-26"
version = "0.1.0"
description = "A citation-grounded RAG assistant for exploring U.S. federal tax information."
readme = "README.md"
authors = [
    { name = "Ian Heraty", email = "heratyian@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "langchain-chroma",
    "python-dotenv",
]

[project.scripts]
title_26 = "title_26.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
